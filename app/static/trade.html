<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loop trade detail</title>
<style>
:root{--bg:#f5f3ee;--surface:#fff;--ink:#15212b;--muted:#5d6b76;--line:#d9d5ca;--accent:#0f6b63;--bad:#a3322a;--ok:#1f6b34}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#10181f;--surface:#17222b;--ink:#e8eef2;--muted:#9aa8b2;--line:#2b3a45;--accent:#4cc3b5;--bad:#ef7d74;--ok:#6fcf8a}}
:root[data-theme="dark"]{--bg:#10181f;--surface:#17222b;--ink:#e8eef2;--muted:#9aa8b2;--line:#2b3a45;--accent:#4cc3b5;--bad:#ef7d74;--ok:#6fcf8a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,sans-serif;padding-inline:16px}
.wrap{max-width:980px;margin:0 auto;padding-block:16px 48px}
nav{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
a,button{color:var(--accent)}a:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button{background:none;border:1px solid var(--line);border-radius:6px;padding:4px 10px;font:inherit;cursor:pointer}
h1{font:600 22px/1.2 Georgia,serif;margin:10px 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin:12px 0;min-width:0}
.card h2{font:600 14px/1.3 "Segoe UI",system-ui,sans-serif;margin:0 0 8px;text-transform:uppercase;color:var(--muted);letter-spacing:.02em}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.fact{border:1px solid var(--line);border-radius:8px;padding:8px}.fact b{display:block;font-size:18px}.fact span{color:var(--muted);font-size:12.5px}
.pos{color:var(--ok)}.neg{color:var(--bad)}.tag{color:var(--muted);font-size:13px}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13.5px}th,td{padding:4px 8px;border-bottom:1px solid var(--line);text-align:left}td.n,th.n{text-align:right}
svg{width:100%;height:auto;display:block}
ul.find{list-style:none;padding:0;margin:0}ul.find li{padding:6px 0;border-bottom:1px solid var(--line)}
</style>
</head>
<body>
<div class="wrap">
<nav aria-label="Trade navigation"><a id="back" href="/">Back to the review</a><span><a id="prev" href="#"></a> <a id="next" href="#"></a> <button type="button" id="lang" aria-label="Switch language">中文</button></span></nav>
<main id="main" aria-live="polite"><p class="tag">Loading…</p></main>
</div>
<script src="/static/trade.js"></script>
</body>
</html>
